# Site
title: Quicksy
subtitle: "Fast Cheat Sheets for Developers"
description: "Quick, practical cheat sheets and references for developers and engineers"
keywords: cheat,sheet,quicksy,reference,programming,code snippets,linux,commands,shortcuts,developers
author: Manvendra Rajpoot
language: en
timezone: "Asia/Kolkata"

# URL
url: https://quicksy.rajpoot.dev
root: /
permalink: :name.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
archive_dir: archives
i18n_dir: :lang
skip_render:
  - "assets/**/*"

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

syntax_highlighter:
highlight:
  enable: false

# Home page
index_generator:
  path: ""
  per_page: 0
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map: {}
tag_map: {}

# Metadata
meta_generator: false

# SEO
seo:
  default_image: "/assets/image/preview.png"
  author_name: "Manvendra Rajpoot"
  author_url: "https://quicksy.rajpoot.dev"
  social:
    twitter: ""
    github: "manvendra-rajpoot"
  site_type: "Developer Resource Platform"
  target_audience: "Developers, Engineers, DevOps, Students"

# Date / Time
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: "date"

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include: []
exclude:
  - ".github"
ignore: []

# Theme
theme: coo

# Nofollow
nofollow:
  enable: true
  field: site
  exclude:
    - "github.com"

# Excerpt
excerpt:
  depth: 2
  hideWholePostExcerpts: true

# Deployment
deploy:
  - type: cjh_bing_url_submitter
  - type: cjh_baidu_url_submitter

# Server
server:
  compress: true

# Sitemap
sitemap:
  path: sitemap.xml
  tags: false
  categories: false

# Markdown
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: false
    typographer: false
    quotes: "“”‘’"
    langPrefix: "hljs language-"
  anchors:
    level: 2
    permalink: true
    permalinkClass: h-anchor
    permalinkSymbol: "#"
    case: 1
    separator: "-"

# Browsersync
browsersync:
  ui: false
  notify: false
  logLevel: silent
